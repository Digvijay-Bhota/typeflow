name: B2B Postgres Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - name: Generate Prisma and migrate
        run: |
          npx prisma validate
          npx prisma generate
          npx prisma migrate dev --name init
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/testing
          DIRECT_URL: postgresql://postgres:password@localhost:5432/testing
      - name: Run Integration Tests
        run: npm run test:pg
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/testing
          DIRECT_URL: postgresql://postgres:password@localhost:5432/testing
