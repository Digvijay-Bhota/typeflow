name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # Stub env vars so Next.js build doesn't fail without real secrets
  NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"
  NEXT_PUBLIC_RAZORPAY_KEY_ID: "rzp_test_placeholder"

jobs:
  # ─── Typecheck ──────────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
          DIRECT_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"

      - name: Run typecheck
        run: npm run typecheck

  # ─── Lint ───────────────────────────────────────────────────────────────────
  lint:
    name: ESLint + Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  # ─── Unit Tests ─────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: typeflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Migrate Database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/typeflow_test"
          DIRECT_URL: "postgresql://postgres:password@localhost:5432/typeflow_test"

      - name: Run unit tests with coverage
        run: npm run test:coverage
        env:
          # Test-only placeholders so getServerEnv() validation passes
          # (e.g. rateLimit -> getRedisClient -> getServerEnv). Not real secrets.
          NODE_ENV: "test"
          SUPABASE_URL: "http://localhost:54321"
          SUPABASE_ANON_KEY: "test-only-supabase-anon-key"
          SUPABASE_SERVICE_ROLE_KEY: "test-only-supabase-service-role-key"
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/typeflow_test"
          DIRECT_URL: "postgresql://postgres:password@localhost:5432/typeflow_test"
          RAZORPAY_KEY_ID: "rzp_test_placeholder"
          RAZORPAY_KEY_SECRET: "test-only-razorpay-key-secret"
          RAZORPAY_WEBHOOK_SECRET: "test-only-razorpay-webhook-secret"
          APP_URL: "http://localhost:3000"
          SESSION_SECRET: "test-only-session-secret-not-for-production"
          CERTIFICATE_SIGNING_SECRET: "test-only-certificate-signing-secret-not-for-production"
          TEST_REDIS_URL: "redis://localhost:6379"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ─── Build ──────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
          DIRECT_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"

      - name: Build Next.js
        run: npm run build
        env:
          # Provide stub values so env validation passes during CI build
          SUPABASE_URL: "https://placeholder.supabase.co"
          SUPABASE_ANON_KEY: "placeholder"
          SUPABASE_SERVICE_ROLE_KEY: "placeholder"
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
          DIRECT_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
          RAZORPAY_KEY_ID: "rzp_test_placeholder"
          RAZORPAY_KEY_SECRET: "placeholder"
          RAZORPAY_WEBHOOK_SECRET: "placeholder"
          APP_URL: "http://localhost:3000"
          SESSION_SECRET: "placeholder-session-secret-32-chars-minimum"
          CERTIFICATE_SIGNING_SECRET: "placeholder-certificate-signing-secret-32-chars"
          REDIS_URL: "rediss://placeholder:6379"
          NODE_ENV: "production"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/
          retention-days: 1
